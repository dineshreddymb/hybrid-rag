[project]
name = "hybrid-rag-api"
version = "0.1.0"
description = "FastAPI + LangGraph hybrid RAG service (dense + BM25)"
requires-python = ">=3.12"
# Versions pinned to a set pip resolved together (2026-11-17).
dependencies = [
    "fastapi==0.163.1",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.34",
    "pydantic-settings==2.16.3",
    "structlog==26.1.0",
    "httpx==0.28.1",
    "pymongo==4.20.0",
    "redis==8.1.0",
    "qdrant-client==1.20.0",
    "rank-bm25==0.2.2",
    "langchain-core==1.8.1",
    "langchain-text-splitters==1.1.3",
    "langchain-google-genai==4.5.0",
    "langgraph==1.2.22",
    "langgraph-checkpoint-mongodb==0.5.1",
    # Langfuse Python SDK v5 needs a Langfuse server >= 4.59 (we run langfuse:4).
    "langfuse==5.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "fakeredis==2.40.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend_app*"]
