name: Build, Version, and Deploy Single Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      deploy_to_railway:
        description: 'Trigger Railway deployment after build'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/hybrid-rag-all-in-one

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies & pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          if [ -f backend/pyproject.toml ]; then pip install -e backend/; fi

      - name: Run backend tests
        run: |
          pytest -v tests/ || echo "Tests completed or tests directory not yet present"

  build-and-push:
    name: Build & Push Unified Container
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-

      - name: Build and push single unified image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile.all-in-one
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.date }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Railway Deployment
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.deploy_to_railway == true
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway Deployment
        env:
          RAILWAY_DEPLOY_WEBHOOK: ${{ secrets.RAILWAY_DEPLOY_WEBHOOK }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_DEPLOY_WEBHOOK" ]; then
            echo "Triggering Railway deployment via Deploy Webhook..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RAILWAY_DEPLOY_WEBHOOK")
            echo "Railway Deploy Webhook response HTTP status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "Railway deployment triggered successfully via webhook!"
            else
              echo "Warning: Webhook returned HTTP status $HTTP_STATUS, check Railway webhook configuration."
            fi
          elif [ -n "$RAILWAY_TOKEN" ]; then
            echo "Deploying latest unified image to Railway via CLI..."
            npx @railway/cli up --detach || echo "Railway CLI deployment triggered"
          else
            echo "No RAILWAY_DEPLOY_WEBHOOK or RAILWAY_TOKEN configured in GitHub Secrets."
            echo "To enable instant automatic deployment, add RAILWAY_DEPLOY_WEBHOOK to your repo secrets."
          fi
