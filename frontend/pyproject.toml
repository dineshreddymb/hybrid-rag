[project]
name = "hybrid-rag-ui"
version = "0.1.0"
description = "Dash web UI for the hybrid RAG (chat, documents, retrieval debug, eval, logs, health)"
requires-python = ">=3.12"
# Versions pinned to a set pip resolved together (2026-11-17).
dependencies = [
    "dash==4.5.0",
    "dash-bootstrap-components==2.0.4",
    "plotly==7.1.0",
    "httpx==0.28.1",
    "gunicorn==27.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["frontend_app*"]
