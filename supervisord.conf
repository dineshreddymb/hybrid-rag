[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# --- 1. DATA STORES (Priority 10 - start first, stop last) ---

[program:mongodb]
command=/usr/bin/mongod --dbpath /data/db --bind_ip 127.0.0.1
environment=LD_PRELOAD="/usr/local/lib/libfake_uname.so",GLIBC_TUNABLES="glibc.pthread.rseq=0"
priority=10
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --protected-mode no --dir /data/redis
priority=10
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:qdrant]
directory=/qdrant
command=/usr/local/bin/qdrant
environment=QDRANT__STORAGE__STORAGE_PATH="/data/qdrant"
priority=10
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# --- 2. BACKEND API (Priority 20 - starts after databases) ---

[program:backend]
directory=/srv/backend
command=/opt/venv/bin/uvicorn backend_app.main:app --host 0.0.0.0 --port 8000
priority=20
autostart=true
autorestart=true
startsecs=5
environment=MONGO_URI="mongodb://127.0.0.1:27017",QDRANT_URL="http://127.0.0.1:6333",REDIS_URL="redis://127.0.0.1:6379/0",DOCS_DIR="/data/docs",PYTHONPATH="/srv/backend"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# --- 3. FRONTEND UI & MCP SERVER (Priority 30 - start last) ---

[program:frontend]
directory=/srv/frontend
command=/opt/venv/bin/gunicorn -b 0.0.0.0:8050 --workers 2 --threads 4 --timeout 180 frontend_app.main:server
priority=30
autostart=true
autorestart=true
startsecs=3
environment=BACKEND_URL="http://127.0.0.1:8000",PYTHONPATH="/srv/frontend"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mcp-server]
directory=/srv/mcp-server
command=/opt/venv/bin/python -m mcp_server --transport http
priority=30
autostart=true
autorestart=true
startsecs=3
environment=BACKEND_URL="http://127.0.0.1:8000",MCP_HOST="0.0.0.0",MCP_PORT="8100",MCP_PATH="/mcp",PYTHONPATH="/srv/mcp-server"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
