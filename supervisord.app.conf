[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# --- 1. BACKEND API (Priority 20) ---

[program:backend]
directory=/srv/backend
command=/opt/venv/bin/uvicorn backend_app.main:app --host 0.0.0.0 --port 8000
priority=20
autostart=true
autorestart=true
startsecs=5
environment=PYTHONPATH="/srv/backend"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# --- 2. FRONTEND UI & MCP SERVER (Priority 30) ---

[program:frontend]
directory=/srv/frontend
command=/opt/venv/bin/gunicorn -b 0.0.0.0:8050 --workers 2 --threads 4 --timeout 180 frontend_app.main:server
priority=30
autostart=true
autorestart=true
startsecs=3
environment=PYTHONPATH="/srv/frontend"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mcp-server]
directory=/srv/mcp-server
command=/opt/venv/bin/python -m mcp_server --transport http
priority=30
autostart=true
autorestart=true
startsecs=3
environment=PYTHONPATH="/srv/mcp-server"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
